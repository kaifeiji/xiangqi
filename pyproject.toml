[project]
name = "xiangqi"
version = "0.1.0"
description = "Chinese chess move prediction training project"
requires-python = ">=3.11,<3.13"

dependencies = [
    "cchess>=1.25,<2",
    "numpy>=2.0,<3",
    "torch==2.6.0",
    "zstandard>=0.23,<1",
]

[tool.uv]
default-groups = ["dev"]
package = false

[dependency-groups]
dev = [
    "onnx>=1.16,<2",
    "pytest>=8.0,<9",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.uv.sources]
torch = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true