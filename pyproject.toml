[project]
name = "xiangqi"
version = "0.1.0"
description = "Chinese chess move prediction training project"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=2.0,<3",
    "torch==2.6.0",
]

[tool.uv]
default-groups = ["dev"]

[dependency-groups]
dev = [
    "pytest>=8.0,<9",
]

[tool.uv.sources]
torch = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true