[package]
name = "xiangqi"
version = "0.1.0"
edition = "2021"

[lib]
name = "xiangqi"
path = "src/backend/lib.rs"
crate-type = ["rlib"]

[[bin]]
name = "xiangqi-server"
path = "src/backend/main.rs"

[dependencies]
axum = "0.8"
ndarray = "0.17"
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["ndarray", "load-dynamic", "api-22"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }
uuid = { version = "1", features = ["v4", "serde"] }
